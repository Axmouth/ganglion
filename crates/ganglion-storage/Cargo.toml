[package]
name = "ganglion-storage"
version = "0.1.0"
edition = "2021"
description = "Storage abstractions for the ganglion cluster coordination engine."
license = "MIT"
repository = "https://github.com/Axmouth/ganglion"

[features]
default = []
keratin = ["dep:keratin-log", "dep:futures"]

[dependencies]
ganglion-core = { path = "../ganglion-core", version = "0.1.0" }
futures = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.keratin-log]
path = "../../../keratin/keratin-log"
optional = true

[dev-dependencies]
proptest = "1"
